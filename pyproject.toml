[tool.poetry]
name = "manhwa-dubbing-system"
version = "0.1.0"
description = "Minimal Python utilities for the manhwa dubbing system."
authors = ["Manhwa Dubbing Team"]
packages = [
  { include = "manhwa_ml" },
  { include = "Tlok_Backend" }
]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
moviepy = ">=2.0,<3.0"

[tool.poetry.group.ml.dependencies]
pillow = ">=10.0,<12.0"
opencv-python = ">=4.9,<5.0"
pytesseract = ">=0.3,<0.4"
transformers = ">=4.40,<5.0"
torch = ">=2.2,<3.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<9.0"

[tool.poetry.scripts]
build-video = "Tlok_Backend.serv1:main"
manhwa-ml = "manhwa_ml.cli:main"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
