name: Docker CI

on:
  push:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - ".dockerignore"
      - "backend-rust/**"
      - "frontend/**"
      - "manhwa_ml/**"
      - "assets/**"
      - ".github/workflows/docker.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - ".dockerignore"
      - "backend-rust/**"
      - "frontend/**"
      - "manhwa_ml/**"
      - "assets/**"
      - ".github/workflows/docker.yml"

jobs:
  docker:
    name: build image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: manhwa-dubbing-system:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
